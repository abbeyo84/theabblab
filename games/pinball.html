<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ABBEYO PINBALL — from The Abb Lab. Z, slash, and Space.">
  <meta name="theme-color" content="#0a0b0f">
  <meta property="og:title" content="ABBEYO PINBALL — The Abb Lab">
  <meta property="og:description" content="Z left, / right, Space to launch.">
  <title>ABBEYO PINBALL — The Abb Lab</title>

  <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css?v=8">
  <link rel="stylesheet" href="/games/pinball.css?v=2">
</head>
<body class="pinball-page">

  <div class="pinball-page__bg" aria-hidden="true"></div>

  <div class="pinball-shell">
    <header class="pinball-topbar">
      <a href="../index.html#games" class="pinball-back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Games
      </a>
      <span class="pinball-brand__name">ABBEYO PINBALL</span>
      <button type="button" class="btn btn--ghost pinball-full" id="pinballFull">Full screen</button>
    </header>

    <main class="pinball-stage" id="pinballStage">
      <canvas id="canvas" class="pinball-canvas" tabindex="0" aria-label="Abbeyo Pinball table"></canvas>
      <p class="pinball-loading" id="pinballLoading">Loading table…</p>
    </main>

    <p class="pinball-keys" aria-label="Controls">
      <span><kbd>Z</kbd> left</span>
      <span><kbd>/</kbd> right</span>
      <span><kbd>Space</kbd> launch</span>
    </p>
  </div>

  <script src="/games/pinball.js?v=2" defer></script>
</body>
</html>
